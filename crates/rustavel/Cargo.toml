[package]
name = "rustavel"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustavel-foundation = { path = "../rustavel-foundation" }
rustavel-config = { path = "../rustavel-config" }
rustavel-router = { path = "../rustavel-router" }
rustavel-http = { path = "../rustavel-http" }
rustavel-macros = { path = "../rustavel-macros" }
rustavel-orm = { path = "../rustavel-orm" }
rustavel-auth = { path = "../rustavel-auth" }
rustavel-validation = { path = "../rustavel-validation" }
rustavel-queue = { path = "../rustavel-queue" }
rustavel-cache = { path = "../rustavel-cache" }
rustavel-events = { path = "../rustavel-events" }
rustavel-schedule = { path = "../rustavel-schedule" }
rustavel-cli = { path = "../rustavel-cli" }
rustavel-testing = { path = "../rustavel-testing" }
# M6 advanced crates (Sprint 07). rustavel-ai is opt-in (NFR-Sca-02):
# core builds never pull AI/provider SDKs without the `ai` feature.
rustavel-broadcast = { path = "../rustavel-broadcast" }
rustavel-storage = { path = "../rustavel-storage" }
rustavel-search = { path = "../rustavel-search" }
rustavel-jsonapi = { path = "../rustavel-jsonapi" }
rustavel-ai = { path = "../rustavel-ai", optional = true }

[features]
default = []
# M6 AI SDK is additive; `ai-search`/`ai-storage`/`ai-mcp` forward the
# deferred-loader features of rustavel-ai itself.
ai = ["dep:rustavel-ai"]
ai-search = ["dep:rustavel-ai", "rustavel-ai/search"]
ai-storage = ["dep:rustavel-ai", "rustavel-ai/storage"]
ai-mcp = ["dep:rustavel-ai", "rustavel-ai/mcp"]

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
