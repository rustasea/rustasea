# Runnable example app — README members = ["crates/*"]; the app is a crate
# like any other, with `cargo run -p rustavel-app` / `cargo dev` serving the
# example HTTP application. No [[bin]] needed: Cargo auto-detects
# `src/main.rs` as the default binary target.
[package]
name = "rustavel-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Rustavel runnable app scaffold — `cargo dev` serves the example HTTP application."

[dependencies]
rustavel = { path = "../rustavel" }
tokio = { workspace = true }
axum = { workspace = true }
anyhow = "1"
serde = { workspace = true, features = ["derive"] }
