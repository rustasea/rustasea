[package]
name = "rustavel-http"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP layer for Rustavel — AppState, middleware, and HTTP client"

[dependencies]
axum = { version = "0.7" }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
rustavel-router = { path = "../rustavel-router" }
