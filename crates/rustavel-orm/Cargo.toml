[package]
name = "rustavel-orm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rustavel ORM — models, fluent query builder, migrations, factories, vector support"

[features]
default = ["postgres"]
# Driver dialects. Exactly one is expected; stubs keep cross-dialect SQL emission isolated.
postgres = []
mysql = []
sqlite = []
# pgvector support (whereVectorSimilarTo, vector column type).
vector = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

[dev-dependencies]
rustavel-macros = { path = "../rustavel-macros" }
