description = "Rustavel authentication and security — JWT/session guards, origin-aware CSRF, throttling"

[dependencies]
rustavel-foundation = { path = "../rustavel-foundation" }
rustavel-http = { path = "../rustavel-http" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
tower = { workspace = true }
axum = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
