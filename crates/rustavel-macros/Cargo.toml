[package]
name = "rustavel-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Procedural macros for Rustavel — #[route] and #[middleware]"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
