[package]
name = "rustasea-inertia-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RustaSea Inertia WASM client — Page parsing, generated component registry, navigation"

[dependencies]
# Protocol-only: the server crate's axum glue is feature-gated off so this
# crate stays WASM-safe.
rustasea-inertia = { path = "../rustasea-inertia", default-features = false }
http = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
