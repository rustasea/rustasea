<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RustaSea</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-slate-50 antialiased">
  <div class="flex min-h-full flex-col items-center justify-center px-6 py-16 text-center">
    <div class="rounded-3xl border border-slate-200 bg-white px-12 py-10 shadow-sm max-w-xl w-full">
      <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 sm:text-5xl">RustaSea</h1>
      <p class="mt-4 text-lg leading-relaxed text-slate-500">
        The Laravel-style web framework for Rust — your application is running.
      </p>
      <div class="mt-10 flex flex-wrap items-center justify-center gap-4">
        <a href="/welcome" class="rounded-lg bg-indigo-600 px-5 py-3 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500">Welcome</a>
        <a href="/health" class="rounded-lg bg-slate-100 px-5 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-200">Health check</a>
      </div>
    </div>
    <div class="mt-10 grid max-w-2xl gap-6 text-left sm:grid-cols-2">
      <a href="https://github.com/vheins/rustasea" class="group rounded-2xl border border-slate-200 bg-white p-6 shadow-sm hover:border-indigo-300">
        <h2 class="text-base font-semibold text-slate-900">Documentation</h2>
        <p class="mt-2 text-sm text-slate-500">Read the RustaSea guides and API reference on GitHub.</p>
      </a>
      <a href="/health" class="group rounded-2xl border border-slate-200 bg-white p-6 shadow-sm hover:border-indigo-300">
        <h2 class="text-base font-semibold text-slate-900">Health check</h2>
        <p class="mt-2 text-sm text-slate-500">Confirm the dev server is alive: returns JSON status.</p>
      </a>
    </div>
    <p class="mt-10 text-sm text-slate-400">Served by RustaSea on axum</p>
  </div>
</body>
</html>
