[workspace]
members = [
    "crates/rustavel",
    "crates/rustavel-foundation",
    "crates/rustavel-config",
    "crates/rustavel-macros",
    "crates/rustavel-router",
    "crates/rustavel-http",
    "crates/rustavel-orm",
    "crates/rustavel-auth",
    "crates/rustavel-validation",
    "crates/rustavel-queue",
    "crates/rustavel-cache",
    "crates/rustavel-events",
    "crates/rustavel-schedule",
    "crates/rustavel-cli",
    "crates/rustavel-testing",
    "crates/rustavel-broadcast",
    "crates/rustavel-storage",
    "crates/rustavel-search",
    "crates/rustavel-jsonapi",
    "crates/rustavel-ai",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Rustavel Team"]

# Runnable app package (root `src/main.rs` binary). The root package is an
# implicit member of its own workspace; README members stay crates/* + xtask.
# The crate `crates/rustavel` is the umbrella; this is the example app binary
# that `cargo dev` / `cargo run -p rustavel-app` serves.
[package]
name = "rustavel-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Rustavel runnable app scaffold — `cargo dev` serves the example HTTP application."

[[bin]]
name = "rustavel-app"
path = "src/main.rs"

[dependencies]
rustavel = { path = "crates/rustavel" }
tokio = { workspace = true }
axum = { workspace = true }
anyhow = "1"
serde = { workspace = true, features = ["derive"] }

# Single source of truth for shared dependencies; crates opt in with `workspace = true`.
[workspace.dependencies]
# Async + HTTP (M0/M1)
tokio = { version = "1", features = ["fs", "io-util", "io-std", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
# Config / serialization (M0)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
# Security (M3)
jsonwebtoken = { version = "9", default-features = false }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "rand", "simple", "std"] }
tower-sessions = { version = "0.15", default-features = false, features = ["memory-store"] }
# Validation (M3)
validator = { version = "0.19", features = ["derive"] }
# Macros (M0)
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
# Async workloads (M4)
async-trait = "0.1"
# DX / CLI / testing (M5)
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
dialoguer = "0.11"
indicatif = "0.17"
console = "0.15"
strsim = "0.11"
comfy-table = "7"
# Test infrastructure (M5)
testcontainers = "0.23"
dotenvy = "0.15"
rand = "0.8"
# Async streams (M6)
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
tokio-stream = { version = "0.1", features = ["sync"] }
