name: CI

# Quality gate for ExampleApp: formatting, lint, and tests on stable.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege: the workflow only reads repository contents.
permissions:
  contents: read

# Cancel superseded runs for the same ref so re-pushes do not stack jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test
