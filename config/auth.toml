# Authentication configuration — mirrors Laravel 13.x config/auth.php.
[auth]
password_timeout = 10800

[auth.defaults]
guard = "web"
passwords = "users"

[auth.guards.web]
driver = "session"
provider = "users"

[auth.guards.api]
driver = "token"
provider = "users"

[auth.providers.users]
driver = "eloquent"
model = "App\\Models\\User"

[auth.passwords.users]
provider = "users"
table = "password_reset_tokens"
expire = 60
throttle = 60
